<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Star Games!</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Arial, sans-serif; color: white; background: #0f0f14; }
    body::before { content: ""; position: fixed; inset: 0; z-index: 0; background: url("https://mir-s3-cdn-cf.behance.net/project_modules/source/8f444a91900373.5e3d63788609e.gif") center / cover no-repeat; pointer-events: none; }
    body::after { content: ""; position: fixed; inset: 0; z-index: 1; background: rgba(15, 15, 20, .58); pointer-events: none; }
    header, #games, footer { position: relative; z-index: 2; }
    header { padding: 15px; text-align: center; font-size: 24px; font-weight: bold; background: rgba(26,26,34,.86); border-bottom: 2px solid rgba(42,42,53,.9); backdrop-filter: blur(4px); }
    #games { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 20px; }
    .game { display: block; padding: 10px; color: white; text-align: center; text-decoration: none; cursor: pointer; background: rgba(26,26,34,.88); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.25); transition: transform .2s, background .2s; }
    .game:hover { transform: scale(1.05); background: rgba(37,37,51,.96); }
    .game img { display: block; width: 100%; aspect-ratio: 300 / 180; object-fit: cover; border-radius: 8px; background: #1a1a22; }
    .game h3 { margin: 10px 0 5px; }
    .game small { color: #bfc5d2; }
    footer { padding: 10px; color: #ddd; font-size: 12px; text-align: center; background: rgba(15,15,20,.72); }
  </style>
</head>
<body>
  <header>Gold Star Games!</header>
  <div id="games">
    <a href="moto-x3m-pool-party-embed.html" class="game">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTWjJHFpU-f-wZe9nrdnnl0egoqMfE5sk03GU0sLvsHeg&amp;s=10/300x180?text=MotoX3M" alt="MotoX3M">
      <h3>MotoX3M</h3>
    </a>
  </div>
</body>
</html>
