<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Unblocked Games Hub</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
    }

    header {
      background: #1a1a22;
      padding: 15px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      border-bottom: 2px solid #2a2a35;
    }

    #games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .game {
      background: #1a1a22;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      transition: 0.2s;
      cursor: pointer;
      text-decoration: none;
      color: white;
      display: block;
    }

    .game:hover {
      transform: scale(1.05);
      background: #252533;
    }

    .game img {
      width: 100%;
      border-radius: 8px;
    }

    .game h3 {
      margin: 10px 0 5px;
    }

    footer {
      text-align: center;
      padding: 10px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <header>
    🎮 Unblocked Games Hub
  </header>
