<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>1v1.lol Fullscreen</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  height: 100%;
  overflow: hidden;
}

#game {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* fullscreen button */
#fsBtn {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 10;
  padding: 8px 12px;
  background: rgba(0,0,0,0.6);
  color: white;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<button id="fsBtn">Fullscreen</button>

<iframe 
  id="game"
  src="https://unblokedgames.github.io/projects/1v1.lol/index.html"
  allowfullscreen>
</iframe>

<script>
const btn = document.getElementById("fsBtn");

btn.onclick = () => {
  const elem = document.documentElement;
  if (!document.fullscreenElement) {
    elem.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};
</script>

</body>
</html>
